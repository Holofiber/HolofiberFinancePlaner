services:
  postgres:
    image: postgres:17-alpine
    container_name: financialplanner-postgres
    restart: always

    environment:
      POSTGRES_DB: financial_planner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/holofiber/financialplanner-api:latest
    container_name: financialplanner-api
    restart: always

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=financial_planner;Username=postgres;Password=postgres
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: FinancialPlanner
      Jwt__Audience: FinancialPlanner.Api

    ports:
      - "80:8080"

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: